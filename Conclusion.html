<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESEL Conclusion Builder - MYP5 Science</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 10s linear infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // --- Inline SVG Icons ---
        const IconHome = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        );
        const IconExternal = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        );
        const IconEye = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const IconEyeOff = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88 2 12s3-7 10-7a9 9 0 0 1 5.12 1.59m-4.24 4.24a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/><path d="M12 17a9 9 0 0 1-8.12-5.12m13-2.76A9 9 0 0 1 22 12s-3 7-10 7a9 9 0 0 1-1.88-.2"/></svg>
        );
        const IconCopy = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const IconCheck = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17 4 12"/></svg>
        );
        const IconInfo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );

        const modelAnswers = {
            p: "As the temperature of the sodium thiosulfate solution increased from 20°C to 60°C, the rate of reaction increased exponentially, showing a strong positive non-linear correlation.",
            e: "For example, at 20°C the rate was 0.02 s⁻¹, but as the temperature was increased to 60°C, the rate rose significantly to 0.16 s⁻¹, representing an 800% increase in reaction speed.",
            s: "This occurs because increasing temperature provides particles with greater kinetic energy. According to Collision Theory, more particles possess energy equal to or greater than the activation energy (Ea), leading to a higher frequency of successful collisions per second.",
            ev: "These results fully support the initial hypothesis, which predicted that higher thermal energy would accelerate the decomposition of thiosulfate ions.",
            l: "Therefore, the relationship between thermal energy and kinetics is confirmed, providing a valid answer to the research question regarding reaction variables in Unit 3."
        };

        const InputSection = ({ id, letter, label, color, placeholder, strand, value, onChange, showModel, toggleModel }) => (
            <div className="mb-8 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm transition-all hover:border-indigo-300">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                    <div className="flex items-center gap-3">
                        <span className={`w-10 h-10 rounded-xl ${color} text-white flex items-center justify-center font-black text-lg shadow-lg shadow-current/20`}>{letter}</span>
                        <div>
                            <h3 className="font-bold text-slate-800 text-sm leading-tight">{label}</h3>
                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">{strand}</span>
                        </div>
                    </div>
                    <button 
                        onClick={() => toggleModel(id)}
                        className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-tighter bg-slate-100 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600 transition-all"
                    >
                        {showModel[id] ? <><IconEyeOff /> Hide Example</> : <><IconEye /> Compare Answer</>}
                    </button>
                </div>

                <textarea 
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all min-h-[100px] resize-none"
                />

                {showModel[id] && (
                    <div className="mt-4 p-4 bg-indigo-50 rounded-2xl border border-indigo-100">
                        <div className="flex items-center gap-2 mb-2 text-indigo-600">
                            <IconCheck />
                            <span className="text-[10px] font-black uppercase tracking-widest">Exemplar (Level 7-8)</span>
                        </div>
                        <p className="text-sm text-indigo-900 leading-relaxed italic">{modelAnswers[id]}</p>
                    </div>
                )}
            </div>
        );

        const App = () => {
            const [pesel, setPesel] = useState({ p: "", e: "", s: "", ev: "", l: "" });
            const [showModel, setShowModel] = useState({ p: false, e: false, s: false, ev: false, l: false });
            const [copied, setCopied] = useState(false);

            const fullText = `${pesel.p} ${pesel.e} ${pesel.s} ${pesel.ev} ${pesel.l}`.trim();

            const copyToClipboard = () => {
                const textArea = document.createElement("textarea");
                textArea.value = fullText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const toggleModel = (key) => {
                setShowModel(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const updatePesel = (id, value) => {
                setPesel(prev => ({ ...prev, [id]: value }));
            };

            return (
                <div className="min-h-screen bg-slate-50 pb-20 font-sans">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 md:px-8 h-20 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-4 w-1/3">
                            <a href="index.html" className="p-3 bg-slate-100 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-2xl transition-all shadow-sm">
                                <IconHome />
                            </a>
                            <h1 className="font-black text-slate-900 tracking-tighter text-lg uppercase italic hidden md:block">PESEL Builder</h1>
                        </div>

                        <div className="flex justify-center w-1/3">
                            <a href="Conclusion_support.html" className="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white rounded-full text-xs font-black uppercase tracking-widest hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-500/20 whitespace-nowrap">
                                <IconExternal /> Conclusion Support Guide
                            </a>
                        </div>

                        <div className="w-1/3 flex justify-end">
                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] hidden lg:block">Unit 3: Chemistry Lab Support</span>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 md:px-8 py-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
                        <div className="lg:col-span-7 space-y-8">
                            <section className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                                <div className="flex items-center justify-between mb-6">
                                    <div>
                                        <h2 className="text-xl font-black text-slate-900 tracking-tight italic">Experimental Data Set</h2>
                                        <p className="text-slate-500 text-xs font-bold uppercase tracking-widest mt-1">Investigation: Temp vs. Reaction Rate</p>
                                    </div>
                                    <div className="p-2 bg-slate-100 rounded-lg"><IconInfo /></div>
                                </div>

                                <div className="bg-slate-50 rounded-3xl p-6 border border-slate-100 flex flex-col items-center">
                                    <svg viewBox="0 0 500 300" className="w-full max-w-md h-auto overflow-visible">
                                        <line x1="50" y1="250" x2="450" y2="250" stroke="#1e293b" strokeWidth="3" />
                                        <line x1="50" y1="250" x2="50" y2="50" stroke="#1e293b" strokeWidth="3" />
                                        <line x1="50" y1="200" x2="450" y2="200" stroke="#e2e8f0" strokeDasharray="4" />
                                        <line x1="50" y1="150" x2="450" y2="150" stroke="#e2e8f0" strokeDasharray="4" />
                                        <line x1="50" y1="100" x2="450" y2="100" stroke="#e2e8f0" strokeDasharray="4" />
                                        <path d="M 50 240 Q 250 230 430 80" fill="none" stroke="#6366f1" strokeWidth="4" strokeLinecap="round" />
                                        <circle cx="50" cy="240" r="5" fill="#1e293b" />
                                        <circle cx="145" cy="225" r="5" fill="#1e293b" />
                                        <circle cx="240" cy="200" r="5" fill="#1e293b" />
                                        <circle cx="335" cy="155" r="5" fill="#1e293b" />
                                        <circle cx="430" cy="80" r="5" fill="#1e293b" />
                                        <text x="250" y="285" textAnchor="middle" className="text-[12px] font-bold fill-slate-500 uppercase tracking-widest">Temperature (°C)</text>
                                        <text x="20" y="150" textAnchor="middle" className="text-[12px] font-bold fill-slate-500 uppercase tracking-widest" transform="rotate(-90, 20, 150)">Rate (s⁻¹)</text>
                                        <text x="50" y="265" textAnchor="middle" className="text-[10px] font-mono fill-slate-400">20</text>
                                        <text x="430" y="265" textAnchor="middle" className="text-[10px] font-mono fill-slate-400">60</text>
                                    </svg>
                                    <div className="mt-6 grid grid-cols-2 gap-4 w-full text-[10px] font-bold bg-white p-4 rounded-2xl border border-slate-100 text-center">
                                        <div className="text-slate-400 uppercase tracking-tighter">START: 20°C → <span className="text-slate-900 font-mono">0.02 s⁻¹</span></div>
                                        <div className="text-slate-400 uppercase tracking-tighter">FINISH: 60°C → <span className="text-slate-900 font-mono">0.16 s⁻¹</span></div>
                                    </div>
                                </div>
                            </section>

                            <div className="space-y-4">
                                <InputSection id="p" letter="P" label="Point / Claim" color="bg-blue-600" strand="Strand i" placeholder="State the trend shown..." value={pesel.p} onChange={(v) => updatePesel('p', v)} showModel={showModel} toggleModel={toggleModel} />
                                <InputSection id="e" letter="E" label="Evidence / Data" color="bg-indigo-600" strand="Strand i" placeholder="Support with numbers..." value={pesel.e} onChange={(v) => updatePesel('e', v)} showModel={showModel} toggleModel={toggleModel} />
                                <InputSection id="s" letter="S" label="Scientific Explanation" color="bg-amber-500" strand="Strand ii" placeholder="Explain using Collision Theory..." value={pesel.s} onChange={(v) => updatePesel('s', v)} showModel={showModel} toggleModel={toggleModel} />
                                <InputSection id="ev" letter="E" label="Evaluation" color="bg-rose-500" strand="Strand iii" placeholder="Evaluate your hypothesis..." value={pesel.ev} onChange={(v) => updatePesel('ev', v)} showModel={showModel} toggleModel={toggleModel} />
                                <InputSection id="l" letter="L" label="Link / Summary" color="bg-emerald-600" strand="Strand iii" placeholder="Final summary..." value={pesel.l} onChange={(v) => updatePesel('l', v)} showModel={showModel} toggleModel={toggleModel} />
                            </div>
                        </div>

                        <div className="lg:col-span-5 relative">
                            <div className="sticky top-28 bg-slate-900 rounded-[2.5rem] p-8 shadow-2xl border border-white/10 flex flex-col min-h-[500px]">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Live Conclusion Preview</h2>
                                    <button onClick={copyToClipboard} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black transition-all ${copied ? 'bg-emerald-500 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                                        {copied ? "COPIED TO CLIPBOARD" : <><IconCopy /> COPY PARAGRAPH</>}
                                    </button>
                                </div>
                                <div className="flex-grow space-y-2 overflow-y-auto pr-4 custom-scrollbar">
                                    {fullText ? (
                                        <div className="text-base leading-[1.8] text-slate-300 font-medium">
                                            <span className="text-blue-400 font-black mr-1">P</span> <span className="bg-blue-400/10 text-blue-100 rounded px-1">{pesel.p}</span>{' '}
                                            <span className="text-indigo-400 font-black mr-1">E</span> <span className="bg-indigo-400/10 text-indigo-100 rounded px-1">{pesel.e}</span>{' '}
                                            <span className="text-amber-400 font-black mr-1">S</span> <span className="bg-amber-400/10 text-amber-100 rounded px-1">{pesel.s}</span>{' '}
                                            <span className="text-rose-400 font-black mr-1">E</span> <span className="bg-rose-400/10 text-rose-100 rounded px-1">{pesel.ev}</span>{' '}
                                            <span className="text-emerald-400 font-black mr-1">L</span> <span className="bg-emerald-400/10 text-emerald-100 rounded px-1">{pesel.l}</span>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-full text-slate-600 text-center space-y-4 opacity-50">
                                            <div className="w-16 h-16 rounded-full border-4 border-dashed border-slate-700 animate-spin-slow" />
                                            <p className="text-xs font-black uppercase tracking-widest leading-loose">Start typing in the PESEL blocks<br/>to build your conclusion</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
