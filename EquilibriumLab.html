<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilibrium Lab Pro - MYP5/DP Chemistry</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Inline SVG Icons ---
        const IconHome = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        );
        const IconThermometer = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
        );
        const IconWind = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
        );
        const IconGauge = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
        );
        const IconActivity = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        );
        const IconArrowRightLeft = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
        );
        const IconInfo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const IconRefresh = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
        );

        const SYSTEMS = [
            {
                id: 'no2',
                name: 'NO₂ / N₂O₄ System',
                equation: '2NO₂ (brown) ⇌ N₂O₄ (colorless)',
                enthalpy: -57,
                molesReactant: 2,
                molesProduct: 1,
                reactantColor: 'rgba(154, 52, 18, 1)',
                productColor: 'rgba(241, 245, 249, 0.2)',
                type: 'gas'
            },
            {
                id: 'haber',
                name: 'Haber Process',
                equation: 'N₂ + 3H₂ ⇌ 2NH₃',
                enthalpy: -92,
                molesReactant: 4,
                molesProduct: 2,
                reactantColor: 'rgba(59, 130, 246, 0.8)',
                productColor: 'rgba(16, 185, 129, 0.8)',
                type: 'gas'
            },
            {
                id: 'cobalt',
                name: 'Cobalt Complex',
                equation: '[Co(H₂O)₆]²⁺ (pink) + 4Cl⁻ ⇌ [CoCl₄]²⁻ (blue) + 6H₂O',
                enthalpy: 50,
                molesReactant: 5,
                molesProduct: 7,
                reactantColor: 'rgba(244, 114, 182, 1)',
                productColor: 'rgba(30, 64, 175, 1)',
                type: 'solution'
            }
        ];

        const App = () => {
            const [activeSystem, setActiveSystem] = useState(SYSTEMS[0]);
            const [temp, setTemp] = useState(298); 
            const [pressure, setPressure] = useState(1); 
            const [reactantConc, setReactantConc] = useState(70);
            const [productConc, setProductConc] = useState(30);
            const [history, setHistory] = useState([]);

            const canvasRef = useRef(null);
            const frameRef = useRef();
            const stateRef = useRef({ r: 70, p: 30 });

            // 1. EQUILIBRIUM LOGIC ENGINE
            useEffect(() => {
                const timer = setInterval(() => {
                    const { r, p } = stateRef.current;
                    const R_gas = 0.008314; 
                    const T_ref = 298;
                    const K_ref = 1.5; 
                    const deltaH = activeSystem.enthalpy;
                    
                    const targetK = K_ref * Math.exp((-deltaH / (R_gas * 10)) * (1/temp - 1/T_ref));
                    const moleDiff = activeSystem.molesProduct - activeSystem.molesReactant;
                    const pEffect = Math.pow(pressure, -moleDiff * 0.5);
                    
                    const finalK = targetK * pEffect;
                    const rate = 0.02;
                    const diff = (finalK * r) - p;
                    const shift = diff * rate;

                    const nextR = Math.max(1, r - shift);
                    const nextP = Math.max(1, p + shift);
                    
                    stateRef.current = { r: nextR, p: nextP };
                    setReactantConc(nextR);
                    setProductConc(nextP);
                }, 30);

                return () => clearInterval(timer);
            }, [temp, pressure, activeSystem]);

            // 2. RENDERING ENGINE
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let particles = Array.from({ length: 60 }, () => ({
                    x: Math.random(),
                    y: Math.random(),
                    vx: (Math.random() - 0.5) * 0.01,
                    vy: (Math.random() - 0.5) * 0.01
                }));

                const draw = () => {
                    const { r, p } = stateRef.current;
                    const w = canvas.width;
                    const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    if (activeSystem.type === 'gas') {
                        const padding = 60;
                        const barrelW = w - padding * 4;
                        const barrelH = h / 2.5;
                        const startX = padding * 2;
                        const startY = (h - barrelH) / 2;
                        const volFactor = 1 / Math.sqrt(pressure);
                        const gasW = barrelW * volFactor;
                        const plungerX = startX + gasW;

                        const total = r + p;
                        const pRatio = p / total;
                        
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(startX, startY, gasW, barrelH);
                        ctx.clip();
                        
                        ctx.fillStyle = activeSystem.reactantColor;
                        ctx.fillRect(startX, startY, gasW, barrelH);
                        ctx.globalAlpha = pRatio;
                        ctx.fillStyle = activeSystem.productColor.replace(/[\d.]+\)$/g, '1.0)');
                        ctx.fillRect(startX, startY, gasW, barrelH);
                        ctx.restore();
                        ctx.globalAlpha = 1.0;

                        particles.forEach(part => {
                            const speed = (temp / 300) * 5;
                            part.x += part.vx * speed;
                            part.y += part.vy * speed;
                            if (part.x < 0 || part.x > 1) part.vx *= -1;
                            if (part.y < 0 || part.y > 1) part.vy *= -1;
                            const px = startX + part.x * gasW;
                            const py = startY + part.y * barrelH;
                            ctx.beginPath();
                            ctx.arc(px, py, 2.5, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(255,255,255,0.6)';
                            ctx.fill();
                        });

                        ctx.strokeStyle = '#94a3b8';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(startX, startY, barrelW, barrelH);
                        for(let i=1; i<=10; i++) {
                            const gx = startX + (barrelW/10) * i;
                            ctx.beginPath(); ctx.moveTo(gx, startY); ctx.lineTo(gx, startY + 15); ctx.stroke();
                        }
                        ctx.fillStyle = '#475569';
                        ctx.fillRect(plungerX, startY + 5, 10, barrelH - 10);
                        ctx.fillRect(plungerX, startY + barrelH/2 - 5, barrelW - (plungerX - startX), 10);
                        ctx.fillRect(startX + barrelW, startY - 10, 10, barrelH + 20);
                    } else {
                        const beakerW = 200;
                        const beakerH = 220;
                        const bx = (w - beakerW) / 2;
                        const by = (h - beakerH) / 2 + 20;
                        const total = r + p;
                        const pRatio = p / total;
                        ctx.fillStyle = activeSystem.reactantColor;
                        ctx.fillRect(bx+5, by+40, beakerW-10, beakerH-45);
                        ctx.globalAlpha = pRatio;
                        ctx.fillStyle = activeSystem.productColor;
                        ctx.fillRect(bx+5, by+40, beakerW-10, beakerH-45);
                        ctx.globalAlpha = 1.0;
                        ctx.strokeStyle = '#cbd5e1';
                        ctx.lineWidth = 5;
                        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by+beakerH); ctx.lineTo(bx+beakerW, by+beakerH); ctx.lineTo(bx+beakerW, by); ctx.stroke();
                        particles.forEach(part => {
                            const py = by + 50 + part.y * (beakerH - 60);
                            const px = bx + 10 + part.x * (beakerW - 20);
                            ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(255,255,255,0.3)';
                            ctx.fill();
                            part.y -= 0.002 * (temp/300);
                            if (part.y < 0) part.y = 1;
                        });
                    }
                    frameRef.current = requestAnimationFrame(draw);
                };
                draw();
                return () => cancelAnimationFrame(frameRef.current);
            }, [activeSystem, temp, pressure]);

            // 3. GRAPH HISTORY
            useEffect(() => {
                const interval = setInterval(() => {
                    const { r, p } = stateRef.current;
                    setHistory(prev => {
                        const total = r + p;
                        const entry = { r: (r/total)*100, p: (p/total)*100 };
                        const newHistory = [...prev, entry];
                        return newHistory.slice(-100);
                    });
                }, 100);
                return () => clearInterval(interval);
            }, []);

            const handleInject = (type) => {
                const current = stateRef.current;
                if (type === 'r') {
                    stateRef.current = { ...current, r: current.r + 40 };
                } else {
                    stateRef.current = { ...current, p: current.p + 40 };
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Header */}
                        <header className="lg:col-span-12 flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 gap-4 shadow-2xl">
                            <div className="flex items-center gap-4">
                                <a href="index.html" className="p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition text-slate-400 hover:text-white" title="Back to Hub">
                                    <IconHome />
                                </a>
                                <div className="p-3 bg-indigo-600 rounded-2xl shadow-lg shadow-indigo-500/20">
                                    <IconArrowRightLeft />
                                </div>
                                <div>
                                    <h1 className="text-3xl font-black bg-gradient-to-br from-white to-slate-400 bg-clip-text text-transparent italic tracking-tight uppercase">
                                        Le Chatelier Pro
                                    </h1>
                                    <div className="flex items-center gap-2 mt-1">
                                        <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse" />
                                        <p className="text-slate-500 font-bold text-[10px] uppercase tracking-widest flex items-center gap-1">
                                            <IconActivity /> Real-time Kinetic Simulator
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {SYSTEMS.map(sys => (
                                    <button
                                        key={sys.id}
                                        onClick={() => {
                                            setActiveSystem(sys);
                                            stateRef.current = { r: 50, p: 50 };
                                            setHistory([]);
                                        }}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                            activeSystem.id === sys.id 
                                                ? 'bg-indigo-600 text-white ring-4 ring-indigo-500/20' 
                                                : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                                        }`}
                                    >
                                        {sys.name}
                                    </button>
                                ))}
                            </div>
                        </header>

                        {/* Controls */}
                        <aside className="lg:col-span-4 space-y-6">
                            <section className="bg-slate-900/50 p-6 rounded-[2rem] border border-slate-800 shadow-xl backdrop-blur-sm">
                                <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-8 flex items-center gap-2">
                                    <IconGauge /> Environment Parameters
                                </h2>
                                <div className="space-y-10">
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center">
                                            <label className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                                <IconThermometer /> Temperature
                                            </label>
                                            <span className="text-xs font-mono font-bold bg-slate-800 px-3 py-1 rounded-full text-rose-400">{temp}K</span>
                                        </div>
                                        <input type="range" min="200" max="600" value={temp} onChange={(e) => setTemp(Number(e.target.value))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-rose-500" />
                                    </div>
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center">
                                            <label className="text-sm font-bold text-slate-300 flex items-center gap-2">
                                                <IconWind /> Pressure (Volume)
                                            </label>
                                            <span className="text-xs font-mono font-bold bg-slate-800 px-3 py-1 rounded-full text-cyan-400">{pressure.toFixed(1)} atm</span>
                                        </div>
                                        <input type="range" min="0.5" max="5" step="0.1" value={pressure} onChange={(e) => setPressure(Number(e.target.value))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500" />
                                        <p className="text-[10px] text-slate-500 font-medium italic">High P = Low Volume in Syringe</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 pt-6 border-t border-slate-800">
                                        <button onClick={() => handleInject('r')} className="py-3 bg-slate-800 hover:bg-indigo-900/30 text-indigo-400 rounded-2xl text-[10px] font-black uppercase tracking-wider transition-all active:scale-95 border border-slate-700">+ Add Reactant</button>
                                        <button onClick={() => handleInject('p')} className="py-3 bg-slate-800 hover:bg-emerald-900/30 text-emerald-400 rounded-2xl text-[10px] font-black uppercase tracking-wider transition-all active:scale-95 border border-slate-700">+ Add Product</button>
                                    </div>
                                </div>
                            </section>

                            <section className="bg-indigo-600 rounded-[2rem] p-6 shadow-2xl shadow-indigo-500/20 group overflow-hidden relative">
                                <h2 className="text-[10px] font-black text-indigo-200 uppercase tracking-widest mb-2 italic">System Data</h2>
                                <div className="text-lg font-bold mb-4 font-serif text-white tracking-tight leading-snug">{activeSystem.equation}</div>
                                <div className="flex gap-2">
                                    <div className="bg-black/20 px-3 py-1 rounded-full text-[10px] font-black text-indigo-100">ΔH: {activeSystem.enthalpy} kJ</div>
                                    <div className="bg-black/20 px-3 py-1 rounded-full text-[10px] font-black text-indigo-100">{activeSystem.enthalpy < 0 ? 'Exothermic' : 'Endothermic'}</div>
                                </div>
                            </section>
                        </aside>

                        {/* Main Visualizer */}
                        <main className="lg:col-span-8 space-y-6">
                            <div className="bg-slate-900/50 rounded-[2.5rem] border border-slate-800 p-2 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-8 left-8 z-10 flex gap-4">
                                    <div className="px-4 py-2 bg-slate-900/80 backdrop-blur-md rounded-2xl border border-white/5">
                                        <span className="text-[10px] font-black text-indigo-400 uppercase tracking-widest">R: {Math.round(reactantConc)}%</span>
                                    </div>
                                    <div className="px-4 py-2 bg-slate-900/80 backdrop-blur-md rounded-2xl border border-white/5">
                                        <span className="text-[10px] font-black text-emerald-400 uppercase tracking-widest">P: {Math.round(productConc)}%</span>
                                    </div>
                                </div>
                                <canvas ref={canvasRef} width={1600} height={800} className="w-full h-[400px] object-contain" />
                            </div>

                            {/* Analysis Graph */}
                            <div className="bg-slate-900/80 p-8 rounded-[2.5rem] border border-slate-800 shadow-xl">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em]">Equilibrium Yield Analysis</h2>
                                    <div className="flex gap-4">
                                        <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.5)]"/><span className="text-[10px] font-black text-slate-400 uppercase">Reactant</span></div>
                                        <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"/><span className="text-[10px] font-black text-slate-400 uppercase">Product</span></div>
                                    </div>
                                </div>
                                <div className="h-40 flex items-end gap-[1px] relative">
                                    {history.map((pt, i) => (
                                        <div key={i} className="flex-1 flex flex-col justify-end h-full">
                                            <div className="w-full bg-emerald-500/80 rounded-t-sm" style={{ height: `${pt.p}%` }} />
                                            <div className="w-full bg-indigo-500/80 rounded-b-sm" style={{ height: `${pt.r}%` }} />
                                        </div>
                                    ))}
                                    <div className="absolute inset-0 border-b border-slate-800" />
                                </div>
                                <div className="mt-4 flex justify-between text-[10px] font-black text-slate-600 uppercase tracking-widest">
                                    <span>Past State</span>
                                    <span>Time →</span>
                                    <span>Steady State</span>
                                </div>
                            </div>
                        </main>

                        {/* Tips */}
                        <footer className="lg:col-span-12 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-indigo-500/5 p-6 rounded-3xl border border-indigo-500/10 flex items-start gap-4">
                                <div className="p-2 bg-indigo-500/20 rounded-xl text-indigo-400"><IconInfo /></div>
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    <strong className="text-slate-200 block mb-1">Temperature (Heat)</strong>
                                    For <strong>Exothermic</strong> systems, heating up favors reactants. Notice the color change without plunger movement.
                                </p>
                            </div>
                            <div className="bg-cyan-500/5 p-6 rounded-3xl border border-cyan-500/10 flex items-start gap-4">
                                <div className="p-2 bg-cyan-500/20 rounded-xl text-cyan-400"><IconWind /></div>
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    <strong className="text-slate-200 block mb-1">Pressure (Volume)</strong>
                                    Increasing pressure compresses the syringe. The system shifts to the side with <strong>fewer moles</strong>.
                                </p>
                            </div>
                            <div className="bg-emerald-500/5 p-6 rounded-3xl border border-emerald-500/10 flex items-start gap-4">
                                <div className="p-2 bg-emerald-500/20 rounded-xl text-emerald-400"><IconRefresh /></div>
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    <strong className="text-slate-200 block mb-1">Dynamic Equilibrium</strong>
                                    Flat graph lines mean the rates are equal, but particles are still colliding and reacting!
                                </p>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
